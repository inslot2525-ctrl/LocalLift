# Render Blueprint: web service + Postgres. The Workflow service is created in the Dashboard
# (Docker-based workflows cannot be created from a Blueprint or the API yet). See README.md.
services:
  - type: web
    name: locallift-web
    runtime: docker
    plan: starter          # free instances sleep and take ~1 minute to wake: bad for live demos
    region: singapore
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: locallift-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: UPI_VPA
        sync: false
      - key: UPI_NAME
        value: LocalLift
      - key: PRICE_STARTER
        value: "199"
      - key: PRICE_BUNDLE
        value: "499"
      - key: LLM_PROVIDER
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: WORKFLOW_SLUG
        sync: false

databases:
  - name: locallift-db
    plan: free
    region: singapore
    databaseName: locallift
