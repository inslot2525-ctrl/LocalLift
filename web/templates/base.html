<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LocalLift: Diwali posters and WhatsApp messages for your shop{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
  <style>body{font-family:'Noto Sans','Noto Sans Devanagari',system-ui,sans-serif}</style>
</head>
<body class="bg-amber-50 text-stone-900 min-h-screen">
  <header class="bg-rose-900 text-amber-50">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="/" class="font-bold text-lg tracking-tight inline-flex items-center min-h-[44px]">🪔 LocalLift</a>
      <a href="/create" class="text-sm bg-amber-400 text-rose-950 font-semibold px-4 py-2.5 rounded-full inline-flex items-center min-h-[44px]">Make my pack</a>
    </div>
  </header>
  <main class="max-w-3xl mx-auto px-4 py-6">{% block content %}{% endblock %}</main>
  <footer class="max-w-3xl mx-auto px-4 pb-8 text-xs text-stone-500">
    LocalLift collects only your shop name, phone, offer text and optional logo, to make your pack.
  </footer>
</body>
</html>
