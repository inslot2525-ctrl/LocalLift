<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#7a1f1f">
  <title>{% block title %}LocalLift: Diwali posters and WhatsApp messages for your shop{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    tailwind.config = { theme: { extend: {
      colors: {
        paper: '#faf6ef', card: '#ffffff', ink: '#24201c', muted: '#62594f', line: '#e4dacb',
        brand: { DEFAULT: '#7a1f1f', dark: '#5e1616', soft: '#f7ebe6' },
        marigold: { DEFAULT: '#e09a2b', soft: '#fcf0da', dark: '#8a5a0f' },
      },
      fontFamily: {
        sans: ['Mukta', '"Noto Sans Devanagari"', 'system-ui', 'sans-serif'],
        serif: ['"Source Serif 4"', 'Georgia', 'serif'],
      },
    } } };
  </script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
  <style>
    body{font-family:Mukta,'Noto Sans Devanagari',system-ui,sans-serif;font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%}
    h1,h2,.font-serif{font-family:'Source Serif 4',Georgia,serif;letter-spacing:-0.005em}
    input,textarea{font:inherit}
    a:focus-visible,button:focus-visible,summary:focus-visible,input:focus,textarea:focus{outline:2px solid #e09a2b;outline-offset:2px}
    table th,table td{padding:.55rem .5rem}
    table th{font-weight:600;font-size:.85rem}
    input[type=checkbox],input[type=radio]{accent-color:#7a1f1f;width:1.2rem;height:1.2rem;flex-shrink:0}
  </style>
</head>
<body class="bg-paper text-ink min-h-screen flex flex-col">
  <header class="bg-card border-b border-line">
    <div class="max-w-3xl mx-auto px-4 py-2 flex items-center justify-between gap-3">
      <a href="/" class="font-serif font-bold text-[1.35rem] text-brand inline-flex items-center min-h-[44px]">LocalLift</a>
      <a href="/create" class="text-base bg-brand hover:bg-brand-dark text-white font-semibold px-4 rounded-md inline-flex items-center min-h-[44px]">Make my pack</a>
    </div>
    <div class="h-[3px] bg-marigold"></div>
  </header>
  <main class="max-w-3xl w-full mx-auto px-4 py-6 flex-1">{% block content %}{% endblock %}</main>
  <footer class="border-t border-line mt-6">
    <div class="max-w-3xl mx-auto px-4 py-5 text-sm text-muted">
      LocalLift collects only your shop name, phone, offer text and optional logo, to make your pack.
    </div>
  </footer>
</body>
</html>
